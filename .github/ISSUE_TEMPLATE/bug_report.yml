name: Bug report
description: Something doesn't work as expected.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Issues are public. Don't include journal text, entry or journal titles, setup codes, recovery codes, recovery keys, passwords, agent connection files or tokens. Replace them with made-up examples.

        To report a security problem, use the repository's Security tab instead.
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1.
        2.
        3.
  - type: dropdown
    id: platform
    attributes:
      label: Where does it happen?
      multiple: true
      options:
        - Mac app
        - iPhone app
        - iPad app
        - Server
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: On a Mac, choose My Journal > About My Journal. For a build from source, give the commit.
  - type: input
    id: os
    attributes:
      label: Operating system and version
      placeholder: macOS 26.0, iOS 26.0, Ubuntu 24.04
  - type: dropdown
    id: server
    attributes:
      label: Server setup
      options:
        - No server (this device only)
        - Server on this Mac
        - Container
        - Standalone server package
        - Built from source
        - Not sure
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      description: Remove journal content, codes, keys and tokens first.
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy
      options:
        - label: This report contains no journal content, setup or recovery codes, recovery keys, passwords, connection files or tokens.
          required: true
