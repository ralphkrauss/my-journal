name: Release

# Pushing a vMAJOR.MINOR.PATCH tag builds and verifies the standalone server downloads, then stages them in a private
# draft release. Approving release-publish publishes that draft and the container image. Compatible with immutable
# releases: assets are attached before publication, never after. The apps ship through the App Store (testflight.yml).
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    name: Validate release tag
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      RELEASE_TAG: ${{ github.ref_name }}
      RELEASE_REF_TYPE: ${{ github.ref_type }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Require a version tag matching the app
        run: |
          python3 - <<'PY'
          import os, pathlib, re
          tag = os.environ['RELEASE_TAG']
          if os.environ['RELEASE_REF_TYPE'] != 'tag' or not re.fullmatch(r'v[0-9]+\.[0-9]+\.[0-9]+', tag):
              raise SystemExit('Run a release from a vMAJOR.MINOR.PATCH tag.')
          project = pathlib.Path('apps/apple/project.yml').read_text()
          versions = re.findall(r'^\s+MARKETING_VERSION: "([^"]+)"$', project, re.MULTILINE)
          if versions != [tag[1:]]:
              raise SystemExit('The release tag must match MARKETING_VERSION.')
          PY
      - name: Require reviewed source from main
        run: |
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || {
            echo 'Tag a commit that is already on main.' >&2
            exit 1
          }

  quality:
    needs: version
    uses: ./.github/workflows/quality.yml

  audit:
    needs: version
    uses: ./.github/workflows/dependency-audit.yml

  server:
    name: Linux release (${{ matrix.runtime }})
    needs: [quality, audit]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - runtime: linux-x64
            runner: ubuntu-24.04
            platform: linux/amd64
          - runtime: linux-arm64
            runner: ubuntu-24.04-arm
            platform: linux/arm64
    env:
      PACKAGE_RUNTIME: ${{ matrix.runtime }}
      PACKAGE_PLATFORM: ${{ matrix.platform }}
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - run: JOURNAL_VERSION="${RELEASE_TAG#v}" scripts/package-server.sh "$PACKAGE_RUNTIME" artifacts/server
      - run: |
          python3 scripts/test-packaged-server.py artifacts/server
          scripts/test-packaged-container.sh artifacts/server "$PACKAGE_PLATFORM"
      - name: Stage final download
        run: |
          mkdir artifacts/download
          tar -czf "artifacts/download/journal-server-$RELEASE_TAG-$PACKAGE_RUNTIME.tar.gz" -C artifacts/server .
          cd artifacts/download
          sha256sum ./*.tar.gz > "SHA256SUMS-$PACKAGE_RUNTIME"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-${{ matrix.runtime }}
          path: artifacts/download/*
          if-no-files-found: error
          retention-days: 1

  draft:
    name: Stage draft release
    needs: server
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      actions: write
      attestations: write
      contents: write
      id-token: write
    outputs:
      checksums: ${{ steps.stage.outputs.checksums }}
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ github.ref_name }}
      RELEASE_RUN_ID: ${{ github.run_id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: release-*
          path: downloaded
      - name: Validate the complete download set
        id: stage
        run: |
          python3 scripts/prepare-release-assets.py downloaded "$RELEASE_TAG" upload
          {
            echo 'checksums<<CHECKSUMS'
            cat upload/SHA256SUMS
            echo CHECKSUMS
          } >> "$GITHUB_OUTPUT"
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: upload/SHA256SUMS
      - name: Create the private draft release
        run: |
          if gh release view "$RELEASE_TAG" --json tagName >/dev/null 2>&1; then
            echo "A release for $RELEASE_TAG already exists. Review it; delete a stale draft before retrying." >&2
            exit 1
          fi
          gh release create "$RELEASE_TAG" --draft --verify-tag --generate-notes upload/*
      - name: Delete the signed workflow artifacts
        run: |
          gh api --paginate "repos/$GH_REPO/actions/runs/$RELEASE_RUN_ID/artifacts?per_page=100" \
            --jq '.artifacts[] | select(.name | startswith("release-")) | .id' |
            while read -r artifact_id; do
              gh api -X DELETE "repos/$GH_REPO/actions/artifacts/$artifact_id"
            done

  publish:
    name: Publish release
    needs: [draft, container]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: release-publish
    permissions:
      actions: read
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ github.ref_name }}
      STAGED_CHECKSUMS: ${{ needs.draft.outputs.checksums }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: scripts/require-protected-environment.sh release-publish
      - name: Require the draft to hold exactly the staged assets
        run: |
          gh release download "$RELEASE_TAG" --dir published
          cd published
          printf '%s\n' "$STAGED_CHECKSUMS" | cmp - SHA256SUMS
          sha256sum --strict --check SHA256SUMS
          expected="$( (awk '{print $2}' SHA256SUMS && echo SHA256SUMS) | sort)"
          [[ "$(find . -maxdepth 1 -type f -printf '%f\n' | sort)" == "$expected" ]]
      - name: Publish the draft
        run: gh release edit "$RELEASE_TAG" --draft=false

  container:
    name: Container (${{ matrix.architecture }})
    needs: [quality, audit]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: amd64
            runner: ubuntu-24.04
          - architecture: arm64
            runner: ubuntu-24.04-arm
    env:
      IMAGE_ARCH: ${{ matrix.architecture }}
      RELEASE_TAG: ${{ github.ref_name }}
      SOURCE_REVISION: ${{ github.sha }}
      SOURCE_REPOSITORY: ${{ github.repository }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build and verify native image
        run: |
          docker build --platform "linux/$IMAGE_ARCH" -f server/Dockerfile \
            --build-arg JOURNAL_VERSION="${RELEASE_TAG#v}" \
            --label "org.opencontainers.image.version=$RELEASE_TAG" \
            --label "org.opencontainers.image.revision=$SOURCE_REVISION" \
            --label "org.opencontainers.image.source=https://github.com/$SOURCE_REPOSITORY" \
            --label org.opencontainers.image.licenses=Apache-2.0 \
            -t "journal-release:$IMAGE_ARCH" .
          scripts/test-server-image.sh "journal-release:$IMAGE_ARCH" "linux/$IMAGE_ARCH"
          mkdir -p artifacts/container
          docker save "journal-release:$IMAGE_ARCH" | gzip > "artifacts/container/$IMAGE_ARCH.tar.gz"
          cd artifacts/container
          sha256sum "$IMAGE_ARCH.tar.gz" > SHA256SUMS
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: container-${{ matrix.architecture }}
          path: artifacts/container/*
          if-no-files-found: error
          retention-days: 7

  publish-container:
    name: Publish verified container
    needs: [draft, container]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: release-publish
    permissions:
      actions: read
      attestations: write
      contents: read
      id-token: write
      packages: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ github.ref_name }}
      RELEASE_RUN_ID: ${{ github.run_id }}
      RELEASE_ATTEMPT: ${{ github.run_attempt }}
      REGISTRY_USER: ${{ github.actor }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: scripts/require-protected-environment.sh release-publish
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: container-*
          path: downloaded
      - name: Publish multi-platform image
        id: image
        run: scripts/publish-server-image.sh downloaded
      - name: Attest image provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ steps.image.outputs.image }}
          subject-digest: ${{ steps.image.outputs.digest }}
          push-to-registry: true
          # Storage records exist only for organization-owned repositories.
          create-storage-record: false
      - name: Remove registry credentials
        if: always()
        run: docker logout ghcr.io
