title = "Journal source secret scanning"
[extend]
useDefault = true

[[allowlists]]
description = "Generated dependencies, build output, and deliberately local test journals are not source."
paths = ['''(^|/)(\.git|\.build|artifacts|bin|obj|DerivedData|__pycache__)/''']

[[allowlists]]
targetRules = ["generic-api-key"]
description = "Exact public synthetic keys in the version 1 compatibility corpus; see protocol/fixtures/README.md."
condition = "AND"
paths = ['''(^|/)protocol/fixtures/encryption-v1\.json$''']
regexTarget = "secret"
regexes = [
  '''^9f15a4703fff17624dbc7dce7b4cdcd4d4abb8cd6299f305d79e171fb0f2137f$''',
  '''^AAECAwQFBgcICQoLDA0ODxAREhMUFRYXGBkaGxwdHh8=$''',
  '''^M2nQ7ADUSGv0NDWsrAY\+i/sVx/5yY77c05Qv\+xr3aEc=$''',
]

