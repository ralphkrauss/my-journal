# Feature parity across platforms. One entry per feature id; every id used in the front matter of screens/ and flows/ is defined here.
#
# Fields of an entry:
#   title                    one line saying what the feature is (double-quoted)
#   specs                    spec files that define it (screens, flows, commands.md, messages.md)
#   reference                apple | windows | android: the platform that shipped the feature first (or is designing it first).
#                            Its implementation is the working reference for ports; where the spec and any implementation
#                            disagree, one has a bug and the owner decides which is fixed (spec/README.md). Set it when the
#                            feature is added; change it only if the owner moves the reference.
#   apple | windows | android   shipped, partial, planned, different-by-design, not-applicable
#   <platform>-reason        required for different-by-design and not-applicable
#   <platform>-notes         optional: where iPhone, iPad and Mac differ, or what a port must watch
# "apple" covers iPhone, iPad and Mac; the notes say where they differ.
# Removed features (export-entry, archive-entry, and the 1.1 removals of simplifications G, H, J, K, L, M and N) are kept as not-applicable on every platform so nobody rebuilds them.

