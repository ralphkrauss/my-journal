  apple-notes: "Reads a file archive, and the folder that My Journal 1.0 wrote (archive-directory-read). The kind is told by what the picked item is, never by its name."
  windows-notes: "FileOpenPicker, a `.journalarchive` file association and a dropped file start the import. A file that is not an archive is damaged (`settings.archiveImport.error.damaged`); Windows never reads the 1.0 folder."
  android: planned

archive-directory-read:
  title: "Import Archive still reads the folder archive that My Journal 1.0 wrote, when it is encrypted"
  specs: [flows/import-archive.md]
  reference: apple
  apple: shipped
  apple-notes: "The same Import Archive route; the picked item is a folder instead of a file (protocol/archive.md, Directory archive). A folder archive that 1.0 wrote without encryption (a plain-text manifest, recovery format 3 or 4) is refused with settings.archiveImport.error.couldntOpen (2026-10-10: no unencrypted libraries in 1.1)."
  windows: not-applicable
  windows-reason: "Windows never wrote the directory archive, so it has none to read; it reads and writes the file archive only."
  android: not-applicable
  android-reason: "Android never wrote the directory archive, so it has none to read; it reads and writes the file archive only."

